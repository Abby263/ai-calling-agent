services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voice_concierge
      POSTGRES_USER: voice_concierge
      POSTGRES_PASSWORD: voice_concierge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:

